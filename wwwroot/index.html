<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yevmiye Takip Sistemi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Yevmiye Takip Sistemi</h1>

    <section id="employer-section">
        <h2>İşveren Ekle</h2>
        <form id="employer-form">
            <input type="text" id="employer-name" placeholder="İşveren Adı" required>
            <input type="text" id="employer-address" placeholder="Adres">
            <input type="text" id="employer-phone" placeholder="Telefon">
            <button type="submit">Ekle</button>
        </form>
        <ul id="employer-list"></ul>
    </section>

    <section id="worker-section">
        <h2>İşçi Ekle</h2>
        <form id="worker-form">
            <input type="text" id="worker-name" placeholder="Ad Soyad" required>
            <input type="text" id="worker-phone" placeholder="Telefon">
            <input type="number" id="worker-wage" placeholder="Günlük Ücret">
            <button type="submit">Ekle</button>
        </form>
        <ul id="worker-list"></ul>
    </section>

    <section id="record-section">
        <h2>Yevmiye Kaydı Ekle</h2>
        <form id="record-form">
            <select id="record-employer" required></select>
            <select id="record-worker" required></select>
            <input type="date" id="record-date" required>
            <input type="text" id="record-note" placeholder="Not (opsiyonel)">
            <button type="submit">Ekle</button>
        </form>

        <table id="record-table">
            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>İşveren</th>
                    <th>İşçi</th>
                    <th>Not</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="record-table-body"></tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
